      // --- Component 9: Signup Modal ---
      function SignupModal({ isOpen, onClose }) {
        const [mobileNumber, setMobileNumber] = useState('');
        const [isSubmitted, setIsSubmitted] = useState(false);
        const [error, setError] = useState('');

        if (!isOpen) return null;

        const handleSubmit = (e) => {
          e.preventDefault();
          if (!mobileNumber || mobileNumber.length < 10) {
            setError('Please enter a valid 10-digit mobile number');
            return;
          }
          setError('');
          setIsSubmitted(true);
        };

        const handleReset = () => {
          setIsSubmitted(false);
          setMobileNumber('');
          onClose();
        };

        return (
          <div className="modal-backdrop" onClick={onClose}>
            <div className="modal-content" onClick={(e) => e.stopPropagation()}>
              <button className="modal-close-btn" onClick={onClose}>×</button>
              {!isSubmitted ? (
                <div>
                  <h3 className="modal-title">Signup now</h3>
                  <p className="modal-subtitle">Or track your existing application</p>
                  <form className="signup-form" onSubmit={handleSubmit}>
                    <div className="input-group">
                      <label className="input-label">Mobile Number</label>
                      <div className="phone-input-wrapper">
                        <span className="phone-prefix">+91</span>
                        <input
                          type="tel"
                          className="phone-input"
                          placeholder="Enter your 10 digit mobile"
                          maxLength={10}
                          value={mobileNumber}
                          onChange={(e) => {
                            setMobileNumber(e.target.value.replace(/\D/g, ''));
                            setError('');
                          }}
                        />
                      </div>
                      {error && <span style={{ color: '#ef5350', fontSize: '0.8rem' }}>{error}</span>}
                    </div>
                    <label className="terms-label">
                      <input type="checkbox" defaultChecked />
                      <span>I authorize Zerodha to contact me via Call/SMS/WhatsApp for account opening.</span>
                    </label>
                    <button type="submit" className="submit-btn">Continue →</button>
                  </form>
                </div>
              ) : (
                <div className="success-state">
                  <div className="success-icon">✓</div>
                  <h3 className="modal-title">OTP Sent Successfully!</h3>
                  <p className="modal-subtitle">
                    We have sent a 6-digit verification code to <strong>+91 {mobileNumber}</strong>.
                  </p>
                  <p style={{ color: '#666', fontSize: '0.88rem', marginBottom: '20px' }}>
                    (Internship demo verification simulated successfully)
                  </p>
                  <button className="btn-primary" onClick={handleReset}>Done</button>
                </div>
              )}
            </div>
          </div>
        );
      }

      // --- Main App Root ---
      function App() {
        const [isSignupOpen, setIsSignupOpen] = useState(false);

        return (
          <div className="app-root">
            <TickerBar />
            <Navbar onOpenSignup={() => setIsSignupOpen(true)} />
            <main className="main-content">
              <Hero onOpenSignup={() => setIsSignupOpen(true)} />
              <StatsSection />
              <PricingSection />
              <EducationSection />
              <OpenAccount onOpenSignup={() => setIsSignupOpen(true)} />
            </main>
            <Footer />
            <SignupModal isOpen={isSignupOpen} onClose={() => setIsSignupOpen(false)} />
          </div>
        );
      }

      // Render Application
      const root = ReactDOM.createRoot(document.getElementById('root'));
      root.render(<App />);
    </script>
  </body>
</html>
